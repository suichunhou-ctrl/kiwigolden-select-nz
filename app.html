<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Kiwi Golden Select App</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f7f5ef;color:#222}.screen{display:none}.active{display:block}.hero{min-height:100vh;background:linear-gradient(180deg,#082518,#0f3b28);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center}.logo{width:220px;max-width:75%;margin-bottom:24px}.btn{margin-top:36px;padding:16px 34px;border:none;border-radius:999px;background:#d4af37;color:#082518;font-weight:700;font-size:20px}.top{background:linear-gradient(180deg,#082518,#0f3b28);color:#fff;text-align:center;padding:28px}.grid{display:grid;grid-template-columns:repeat(2,minmax(140px,1fr));gap:16px;padding:22px}.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 8px 18px rgba(0,0,0,.08)}.card img{width:100%;aspect-ratio:1/1;object-fit:cover}.info{padding:12px}.price{color:#d4af37;font-weight:700}.nav{position:fixed;bottom:0;left:0;right:0;background:#082518;display:flex;justify-content:space-around;padding:12px}.nav button{background:none;border:none;color:#fff}</style></head><body><div id='home' class='screen active'><div class='hero'><img class='logo' src='52682B39-326C-4127-A495-58F846269CF4.png' alt='Logo'><h1>Kiwi Golden Select NZ</h1><p>New Zealand Original Selection</p><button class='btn' onclick="show('shop')">Continue Exploring</button></div></div><div id='shop' class='screen'><div class='top'><h2>✨ 超级精选</h2><p>Super Selection</p></div><div class='grid'><div class='card'><img src='https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?w=600'><div class='info'><b>Anchor Blue</b><div class='price'>NZ$129</div></div></div><div class='card'><img src='https://images.unsplash.com/photo-1607619056574-7b8d3ee536b2?w=600'><div class='info'><b>Goat Soap</b><div class='price'>NZ$8</div></div></div><div class='card'><img src='https://images.unsplash.com/photo-1556228578-8c89e6adf883?w=600'><div class='info'><b>Red Seal</b><div class='price'>NZ$3.90</div></div></div><div class='card'><img src='https://images.unsplash.com/photo-1619454016518-697bc231e7cb?w=600'><div class='info'><b>Bruntwood</b><div class='price'>NZ$15</div></div></div></div><div class='nav'><button onclick="show('home')">🏠 Home</button><button onclick="location.href='shop.html'">🛒 Shop</button></div></div><script>function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}</script></body></html>
